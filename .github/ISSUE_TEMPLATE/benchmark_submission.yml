name: Benchmark submission
description: Submit a method's results without opening a pull request (the maintainer converts it)
title: "[benchmark] <dataset>: <method>"
labels: [benchmark]
body:
  - type: input
    id: dataset
    attributes: {label: Dataset, description: "An id from benchmarks/datasets/ (for example perov5)"}
    validations: {required: true}
  - type: input
    id: method
    attributes: {label: Method, description: "Name, one-sentence description, number of parameters, training data", placeholder: "MyModel: graph network trained on Perov-5 train, 1.2 M parameters"}
    validations: {required: true}
  - type: dropdown
    id: tasks
    attributes: {label: Tasks, multiple: true, options: [inverse_design, property_prediction, representation]}
    validations: {required: true}
  - type: textarea
    id: outputs
    attributes: {label: Outputs, description: "Public links to predictions.csv and/or candidates.csv with the CIFs (the format is described on the dataset's benchmark page, section Protocol)"}
    validations: {required: true}
  - type: textarea
    id: results
    attributes: {label: Results, description: "The JSON printed by `python scripts/benchmarks.py score ...`, per task"}
  - type: textarea
    id: links
    attributes: {label: Links, description: "Paper, code and weights, if public"}
