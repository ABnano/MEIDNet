name: Bug report
description: Something does not work as documented (the Ask PRISM panel fills this form in for you)
title: "[bug] "
labels: [bug]
body:
  - type: textarea
    id: what_happened
    attributes:
      label: What happened?
      description: The steps you took and the message you saw.
    validations: {required: true}
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
  - type: textarea
    id: diagnostics
    attributes:
      label: Technical details
      description: >-
        MEIDNet version, model, settings and browser, as filled in by Ask PRISM, or the output of `meidnet --version`
        and your meidnet.yaml. Do not paste unpublished data.
      render: text
