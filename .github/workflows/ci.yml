name: tests

on:
  push:
    branches: [main, v2]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install (CPU torch)
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[dev]"
      - name: Fast tests (featurisation, forward pass, training step, families, rules, pipeline)
        run: pytest -m "not slow" -q
      - name: Benchmark files
        run: python scripts/benchmarks.py validate
      - name: Slow regression (full v1-vs-v2 generation)
        if: matrix.python-version == '3.12'
        run: pytest -m slow -q
