name: docs

on:
  push:
    branches: [main]
    paths: ["docs/**", "mkdocs.yml", "meidnet/**", "scripts/build_docs.py", "scripts/benchmarks.py", "benchmarks/**"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[docs]"
      - name: Generate reference pages and the static Studio
        run: python scripts/build_docs.py
      - run: mkdocs gh-deploy --force
