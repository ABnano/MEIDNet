site_name: MEIDNet Prism
site_description: Multimodal inverse design of crystalline materials — with your own data, rules and families.
site_url: https://babu09-meidnet.hf.space/docs/
use_directory_urls: false
repo_url: https://github.com/ABnano/MEIDNet
repo_name: ABnano/MEIDNet
copyright: MIT licence · Anand Babu

theme:
  name: material
  font: false                      # self-hosted fonts (assets/fonts), set in assets/prism-docs.css
  logo: assets/prism-mark.png
  favicon: assets/favicon-64.png
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle: {icon: material/weather-night, name: dark mode}
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle: {icon: material/weather-sunny, name: light mode}
  features: [navigation.tabs, navigation.sections, navigation.top, content.code.copy, content.tabs.link, search.suggest]

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc: {permalink: true}
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed: {alternate_style: true}
  - pymdownx.arithmatex: {generic: true}
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

extra_css:
  - assets/extra.css
  - assets/prism-docs.css

extra_javascript:
  - assets/vendor/mathjax-3.2.2/es5/tex-mml-chtml.js          # served from this site (assets/vendor/README.md)
  - assets/vendor/tablesort-5.3.0/tablesort.min.js
  - assets/vendor/tablesort-5.3.0/sorts/tablesort.number.min.js
  - assets/tablesort.js
  - assets/learn.js
  - assets/links.js
  - assets/prism3d.js
  - assets/prism-tour.js
  - assets/prism-docs.js
  - assets/ask-prism.js                                         # copied from meidnet/studio by scripts/build_docs.py

