[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "meidnet"
version = "2.0.0"
description = "MEIDNet: multimodal structure-property latent space and constrained inverse design of crystalline materials"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [
    { name = "Anand Babu" },
]
keywords = ["materials", "inverse design", "generative model", "perovskite", "contrastive learning"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Topic :: Scientific/Engineering :: Chemistry",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "torch>=2.1",
    "numpy>=1.24",
    "pandas>=2.0",
    "pymatgen>=2024.1.1",
    "scikit-learn>=1.3",
    "matplotlib>=3.7",
    "pyyaml>=6.0",
    "pydantic>=2.5",
    "openpyxl>=3.1",
]

[project.optional-dependencies]
parquet = ["pyarrow>=14"]
stability = ["ase>=3.22", "mace-torch>=0.3.6"]
app = ["gradio>=4.0"]
docs = ["mkdocs-material>=9.5", "mkdocstrings[python]>=0.24"]
dev = ["pytest>=7.4"]

[project.scripts]
meidnet = "meidnet.cli:main"

[project.urls]
Homepage = "https://github.com/ABnano/MEIDNet"
Documentation = "https://abnano.github.io/MEIDNet"
Paper = "https://www.nature.com/articles/s41524-026-02153-3"

[tool.setuptools.packages.find]
include = ["meidnet*"]

[tool.setuptools.package-data]
meidnet = ["families/*.yaml", "studio/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: long-running tests (full v1-vs-v2 generation regression)",
]
